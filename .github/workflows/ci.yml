name: RISE checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rise-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    name: Isolated database and backend
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.13.0
      - run: npm ci
      - run: npm run build
      - run: npm run build:review
      - run: npm run infra:up -- local
      - run: npm run infra:up -- test
      - run: npm run test:infra
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test:backend
      - run: npm run test:auth
      - run: npm run test:sync
      - run: npm run test:push
      - run: npm run test:groups
      - run: npm run test:rollout
      - name: Database security and performance advisors
        run: |
          npx supabase db advisors --local --workdir .rise-infra/local --level warn --fail-on warn
          npx supabase db advisors --local --workdir .rise-infra/test --level warn --fail-on warn
      - name: Retain only redacted test evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infrastructure
          path: test-results/infra/
          retention-days: 7
      - name: Stop only these stacks, retaining their volumes
        if: always()
        run: |
          npm run infra:stop -- local
          npm run infra:stop -- test
  web:
    name: Lint, types, domain and ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the pinned npm release
        run: npm install --global npm@11.13.0
      - run: npm ci
      - run: npm run check:toolchain
      - run: npm run check:notices
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:review
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser -- --project=${{ matrix.browser }}
      - run: npm run test:production -- --project=${{ matrix.browser }}
      - run: npm run test:pwa -- --project=${{ matrix.browser }}
      - name: Retain synthetic test evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
